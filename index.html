<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1e293b">
    <title>Vokabeltrainer</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --cat1: #ef4444;
            --cat2: #f97316;
            --cat3: #eab308;
            --cat4: #22c55e;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 440px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        h1 { font-size: 20px; margin: 0; }
        .sync-status { font-size: 12px; color: var(--muted); background: #e2e8f0; padding: 4px 10px; border-radius: 12px; }
        
        .controls-top { display: flex; gap: 8px; margin-bottom: 14px; }
        button { border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s, background-color 0.2s; }
        button:active { transform: scale(0.97); }
        .btn-dir { flex: 1; background: #1e293b; color: white; padding: 11px 12px; display: flex; align-items: center; justify-content: space-between; }
        .btn-dir.reverse-active { background: #0f766e; }
        .dir-hint { font-size: 11px; background: rgba(255,255,255,0.18); padding: 3px 8px; border-radius: 6px; font-weight: 500; }
        .btn-reload { background: #cbd5e1; color: var(--text); padding: 11px 14px; }

        .card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); display: flex; flex-direction: column; align-items: center; text-align: center; border-top: 8px solid var(--cat1); }
        .card-header { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .badges-left { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .cat-badge { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 20px; color: white; }
        .other-cat-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 12px; background: #f1f5f9; color: var(--muted); border: 1px solid #e2e8f0; }
        .btn-edit { background: #f1f5f9; color: var(--muted); padding: 5px 10px; font-size: 13px; border-radius: 8px; flex-shrink: 0; }
        
        .word-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 18px 0 14px 0; width: 100%; }
        .word-main { font-size: 26px; font-weight: 700; word-break: break-word; }
        .btn-speak { background: #e2e8f0; color: #1e293b; width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 19px; flex-shrink: 0; padding: 0; }
        .btn-speak.speaking { background: #2563eb; color: white; transform: scale(1.08); }
        .btn-speak-inline { background: rgba(15, 23, 42, 0.08); color: inherit; padding: 5px 10px; font-size: 13px; border-radius: 8px; margin-left: 8px; vertical-align: middle; display: inline-flex; align-items: center; gap: 4px; }
        
        .input-group { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
        input[type="text"] { width: 100%; padding: 14px; font-size: 17px; border: 2px solid #cbd5e1; border-radius: 10px; outline: none; text-align: center; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #1e293b; }
        .btn-check { width: 100%; background: #2563eb; color: white; padding: 14px; font-size: 16px; }
        .btn-skip-type { background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; padding: 6px; text-decoration: underline; }

        .edit-box { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 14px; text-align: left; background: #f8fafc; padding: 14px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .edit-box label { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: -6px; }
        .edit-box input { text-align: left; padding: 10px 12px; font-size: 15px; background: white; }
        .edit-actions { display: flex; gap: 8px; margin-top: 4px; }
        .btn-save-edit { flex: 1; background: #16a34a; color: white; padding: 11px; }
        .btn-cancel-edit { flex: 1; background: #cbd5e1; color: var(--text); padding: 11px; }

        .feedback-box { width: 100%; border-radius: 12px; padding: 14px; margin-top: 10px; text-align: left; }
        .fb-exact { background: #dcfce7; border: 1px solid #86efac; color: #14532d; }
        .fb-typo { background: #fef9c3; border: 1px solid #fde047; color: #713f12; }
        .fb-wrong { background: #fee2e2; border: 1px solid #fca5a5; color: #7f1d1d; }
        .fb-title { font-weight: 700; font-size: 16px; margin-bottom: 6px; display: block; }
        .fb-detail { font-size: 14px; line-height: 1.5; }
        .btn-next { width: 100%; background: #1e293b; color: white; padding: 14px; font-size: 16px; margin-top: 12px; }
        .btn-override { background: transparent; color: inherit; opacity: 0.75; font-size: 12px; font-weight: 500; padding: 6px 0 0 0; text-decoration: underline; display: block; width: 100%; text-align: center; }

        .answer-buttons { display: flex; gap: 12px; width: 100%; margin-top: 12px; }
        .btn-wrong { flex: 1; background: #fee2e2; color: #b91c1c; padding: 14px; font-size: 15px; border: 2px solid #fca5a5; }
        .btn-right { flex: 1; background: #dcfce7; color: #15803d; padding: 14px; font-size: 15px; border: 2px solid #86efac; }
        .hidden { display: none !important; }

        .stats-box { background: var(--card); border-radius: 12px; padding: 14px; margin-top: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .stats-header { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; }
        .dir-stats-block { padding: 10px; border-radius: 10px; border: 2px solid transparent; background: #f8fafc; margin-bottom: 8px; transition: border-color 0.2s, background-color 0.2s; }
        .dir-stats-block.active-dir-box { border-color: #1e293b; background: #ffffff; }
        .dir-stats-title { font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--text); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; }
        .stat-item { padding: 6px 4px; border-radius: 7px; color: white; font-weight: 700; font-size: 13px; }
        .stat-label { font-size: 10px; font-weight: 400; display: block; opacity: 0.92; }
        .compare-summary { font-size: 12px; color: var(--muted); text-align: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vokabeltrainer</h1>
            <span id="syncStatus" class="sync-status">Lade Daten...</span>
        </header>

        <div class="controls-top">
            <button type="button" id="btnDirection" class="btn-dir" onclick="toggleDirection()">
                <span id="dirLabel">🇪🇸 Spanisch → 🇩🇪 Deutsch</span>
                <span class="dir-hint">⇄ Wechseln</span>
            </button>
            <button type="button" class="btn-reload" onclick="manualReload()" title="Tabelle neu laden">↻</button>
        </div>

        <div id="flashcard" class="card">
            <div class="card-header">
                <div class="badges-left">
                    <span id="catBadge" class="cat-badge" style="background: var(--cat1);">Kat 1 (Rot)</span>
                    <span id="otherCatBadge" class="other-cat-badge">Gegenrichtung: Kat 1</span>
                </div>
                <button type="button" id="btnEditCard" class="btn-edit" onclick="openEditMode()" title="Vokabel korrigieren">✏️ Korrigieren</button>
            </div>
            
            <div id="wordRow" class="word-row">
                <div class="word-main" id="questionText">Lade Vokabeln...</div>
                <button type="button" id="btnSpeakQuestion" class="btn-speak hidden" onclick="speakSpanish()" title="Spanisch vorlesen">🔊</button>
            </div>

            <!-- Inline-Editor für Duolingo-Tippfehler -->
            <div id="editSection" class="edit-box hidden">
                <label for="editEsInput">Spanisch</label>
                <input type="text" id="editEsInput" />
                <label for="editDeInput">Deutsch</label>
                <input type="text" id="editDeInput" />
                <div class="edit-actions">
                    <button type="button" class="btn-cancel-edit" onclick="closeEditMode()">Abbrechen</button>
                    <button type="button" class="btn-save-edit" onclick="saveWordEdit()">Speichern</button>
                </div>
            </div>

            <!-- Eingabebereich -->
            <div id="inputSection" class="input-group">
                <input type="text" id="userInput" placeholder="Übersetzung eintippen..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
                <button type="button" class="btn-check" onclick="checkTypedAnswer()">Prüfen</button>
                <button type="button" class="btn-skip-type" onclick="manualReveal()">Nur aufdecken (ohne Tippen)</button>
            </div>

            <!-- Auswertung nach Eingabe -->
            <div id="feedbackSection" class="hidden" style="width: 100%;">
                <div id="feedbackBox" class="feedback-box">
                    <span id="fbTitle" class="fb-title"></span>
                    <div id="fbDetail" class="fb-detail"></div>
                    <button type="button" id="btnOverride" class="btn-override" onclick="overrideLastResult()"></button>
                </div>
                <button type="button" class="btn-next" onclick="pickNextWord()">Nächstes Wort ➔</button>
            </div>

            <!-- Klassische Buttons bei manuellem Aufdecken -->
            <div id="manualSection" class="hidden" style="width: 100%;">
                <div style="padding: 12px 0; border-top: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px;">
                    <span id="manualSolution" style="font-size: 21px; font-weight: 600; color: #334155;"></span>
                    <button type="button" id="btnSpeakManual" class="btn-speak-inline hidden" onclick="speakSpanish()">🔊 Anhören</button>
                </div>
                <div class="answer-buttons">
                    <button type="button" class="btn-wrong" onclick="submitManualResult(false)">✕ Falsch</button>
                    <button type="button" class="btn-right" onclick="submitManualResult(true)">✓ Richtig</button>
                </div>
            </div>
        </div>

        <div class="stats-box">
            <div class="stats-header">
                <span>Lernstand-Vergleich</span>
                <span id="totalCount">0 Vokabeln</span>
            </div>

            <!-- Statistik Richtung 1: Spanisch -> Deutsch -->
            <div id="boxStatsEsDe" class="dir-stats-block active-dir-box">
                <div class="dir-stats-title">
                    <span>🇪🇸 → 🇩🇪 Spanisch → Deutsch</span>
                    <span id="avgEsDe">Ø 1,0</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-item" style="background: var(--cat1);"><span id="esde1">0</span><span class="stat-label">Rot</span></div>
                    <div class="stat-item" style="background: var(--cat2);"><span id="esde2">0</span><span class="stat-label">Orange</span></div>
                    <div class="stat-item" style="background: var(--cat3);"><span id="esde3">0</span><span class="stat-label">Gelb</span></div>
                    <div class="stat-item" style="background: var(--cat4);"><span id="esde4">0</span><span class="stat-label">Grün</span></div>
                </div>
            </div>

            <!-- Statistik Richtung 2: Deutsch -> Spanisch -->
            <div id="boxStatsDeEs" class="dir-stats-block">
                <div class="dir-stats-title">
                    <span>🇩🇪 → 🇪🇸 Deutsch → Spanisch</span>
                    <span id="avgDeEs">Ø 1,0</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-item" style="background: var(--cat1);"><span id="dees1">0</span><span class="stat-label">Rot</span></div>
                    <div class="stat-item" style="background: var(--cat2);"><span id="dees2">0</span><span class="stat-label">Orange</span></div>
                    <div class="stat-item" style="background: var(--cat3);"><span id="dees3">0</span><span class="stat-label">Gelb</span></div>
                    <div class="stat-item" style="background: var(--cat4);"><span id="dees4">0</span><span class="stat-label">Grün</span></div>
                </div>
            </div>

            <div id="compareSummary" class="compare-summary">Lade Vergleichsdaten...</div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyBBBayN47em1xvrqQ2nJ70xf2hQXYt_Qlz4cDeQr_Q6UW5Qk33i3joiQfYYF51JNcJ/exec";
        const CACHE_KEY = "vokabeltrainer_cache_v2";

        let vocab = [];
        let currentWord = null;
        let esToDe = true;
        let stepState = "answering"; // "answering" | "evaluated" | "manual"
        let stateBeforeEdit = "answering";
        let lastCatBeforeChange = 1;
        let lastCountedCorrect = false;
        let modifiedInSession = new Set();
        let spanishVoice = null;

        const catMeta = {
            1: { name: "Kat 1 (Rot)", color: "#ef4444", weight: 8 },
            2: { name: "Kat 2 (Orange)", color: "#f97316", weight: 4 },
            3: { name: "Kat 3 (Gelb)", color: "#eab308", weight: 2 },
            4: { name: "Kat 4 (Grün)", color: "#22c55e", weight: 1 }
        };

        function normalizeWordItem(item) {
            return {
                es: String(item.es || "").trim(),
                de: String(item.de || "").trim(),
                catEsDe: Math.min(Math.max(parseInt(item.catEsDe || item.cat || 1) || 1, 1), 4),
                catDeEs: Math.min(Math.max(parseInt(item.catDeEs || 1) || 1, 1), 4)
            };
        }

        function getActiveCat(word) {
            return esToDe ? word.catEsDe : word.catDeEs;
        }

        function getOtherCat(word) {
            return esToDe ? word.catDeEs : word.catEsDe;
        }

        function setActiveCat(word, value) {
            if (esToDe) {
                word.catEsDe = value;
            } else {
                word.catDeEs = value;
            }
        }

        function loadSpanishVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            spanishVoice = voices.find(v => v.lang === 'es-ES') 
                        || voices.find(v => v.lang.startsWith('es')) 
                        || null;
        }

        if ('speechSynthesis' in window) {
            loadSpanishVoice();
            window.speechSynthesis.onvoiceschanged = loadSpanishVoice;
        }

        function speakSpanish() {
            if (!currentWord || !('speechSynthesis' in window)) {
                alert("Sprachausgabe wird von diesem Browser leider nicht unterstützt.");
                return;
            }

            window.speechSynthesis.cancel();
            const textToSpeak = currentWord.es.replace(/\([^)]*\)/g, "").trim();
            if (!textToSpeak) return;

            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = "es-ES";
            utterance.rate = 0.9;
            if (!spanishVoice) loadSpanishVoice();
            if (spanishVoice) utterance.voice = spanishVoice;

            const btnTop = document.getElementById("btnSpeakQuestion");
            utterance.onstart = () => btnTop.classList.add("speaking");
            utterance.onend = () => btnTop.classList.remove("speaking");
            utterance.onerror = () => btnTop.classList.remove("speaking");

            window.speechSynthesis.speak(utterance);
        }

        document.getElementById("userInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                if (stepState === "answering") {
                    checkTypedAnswer();
                }
            }
        });

        document.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && stepState === "evaluated" && document.activeElement.id !== "userInput") {
                e.preventDefault();
                pickNextWord();
            }
        });

        function saveToLocalCache() {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(vocab));
            } catch (e) {}
        }

        function loadFromLocalCache() {
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) && parsed.length > 0 ? parsed.map(normalizeWordItem) : null;
            } catch (e) {
                return null;
            }
        }

        function initApp() {
            const cached = loadFromLocalCache();
            if (cached) {
                vocab = cached;
                updateStats();
                pickNextWord();
                loadVocab(true);
            } else {
                loadVocab(false);
            }
        }

        function manualReload() {
            modifiedInSession.clear();
            loadVocab(false);
        }

        async function loadVocab(isBackground) {
            setStatus(isBackground ? "Aktualisiere..." : "Lade Tabelle...");
            try {
                const response = await fetch(API_URL);
                const rawList = await response.json();
                const freshVocab = rawList.map(normalizeWordItem);

                if (modifiedInSession.size > 0) {
                    const localMap = new Map(vocab.map(w => [`${w.es}|${w.de}`, w]));
                    freshVocab.forEach(item => {
                        const key = `${item.es}|${item.de}`;
                        if (modifiedInSession.has(key) && localMap.has(key)) {
                            const localItem = localMap.get(key);
                            item.catEsDe = localItem.catEsDe;
                            item.catDeEs = localItem.catDeEs;
                        }
                    });
                }

                vocab = freshVocab;
                saveToLocalCache();
                updateStats();

                if (currentWord) {
                    const updatedCurrent = vocab.find(w => w.es === currentWord.es && w.de === currentWord.de);
                    if (updatedCurrent) currentWord = updatedCurrent;
                }

                if (!isBackground || !currentWord) {
                    pickNextWord();
                } else if (stepState === "answering") {
                    renderQuestion();
                }

                setStatus("Synchronisiert ✓");
            } catch (err) {
                if (vocab.length > 0) {
                    setStatus("Offline-Modus");
                } else {
                    setStatus("Verbindungsfehler!");
                    document.getElementById("questionText").innerText = "Fehler beim Laden der Google-Tabelle.";
                }
            }
        }

        function setStatus(text) {
            document.getElementById("syncStatus").innerText = text;
        }

        function toggleDirection() {
            esToDe = !esToDe;

            const btn = document.getElementById("btnDirection");
            btn.classList.toggle("reverse-active", !esToDe);
            document.getElementById("dirLabel").innerText = esToDe 
                ? "🇪🇸 Spanisch → 🇩🇪 Deutsch" 
                : "🇩🇪 Deutsch → 🇪🇸 Spanisch";

            document.getElementById("boxStatsEsDe").classList.toggle("active-dir-box", esToDe);
            document.getElementById("boxStatsDeEs").classList.toggle("active-dir-box", !esToDe);

            if (vocab.length > 0) {
                pickNextWord();
            }
        }

        function openEditMode() {
            if (!currentWord) return;
            stateBeforeEdit = stepState;
            document.getElementById("editEsInput").value = currentWord.es;
            document.getElementById("editDeInput").value = currentWord.de;

            document.getElementById("wordRow").classList.add("hidden");
            document.getElementById("inputSection").classList.add("hidden");
            document.getElementById("feedbackSection").classList.add("hidden");
            document.getElementById("manualSection").classList.add("hidden");
            document.getElementById("editSection").classList.remove("hidden");
            document.getElementById("editEsInput").focus();
        }

        function closeEditMode() {
            document.getElementById("editSection").classList.add("hidden");
            document.getElementById("wordRow").classList.remove("hidden");

            if (stateBeforeEdit === "answering") {
                document.getElementById("inputSection").classList.remove("hidden");
            } else if (stateBeforeEdit === "evaluated") {
                document.getElementById("feedbackSection").classList.remove("hidden");
            } else if (stateBeforeEdit === "manual") {
                document.getElementById("manualSection").classList.remove("hidden");
            }
        }

        async function saveWordEdit() {
            const newEs = document.getElementById("editEsInput").value.trim();
            const newDe = document.getElementById("editDeInput").value.trim();
            if (!newEs || !newDe) return;

            const oldEs = currentWord.es;
            const oldDe = currentWord.de;

            currentWord.es = newEs;
            currentWord.de = newDe;
            modifiedInSession.add(`${newEs}|${newDe}`);
            saveToLocalCache();

            document.getElementById("questionText").innerText = esToDe ? newEs : newDe;
            document.getElementById("manualSolution").innerText = esToDe ? newDe : newEs;
            closeEditMode();

            setStatus("Speichert Korrektur...");
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "editWord",
                        oldEs: oldEs,
                        oldDe: oldDe,
                        newEs: newEs,
                        newDe: newDe
                    })
                });
                setStatus("Korrektur gespeichert ✓");
            } catch (err) {
                setStatus("Lokal korrigiert (Offline)");
            }
        }

        function pickNextWord() {
            if (vocab.length === 0) {
                document.getElementById("questionText").innerText = "Keine Vokabeln gefunden.";
                document.getElementById("btnSpeakQuestion").classList.add("hidden");
                return;
            }

            let pool = vocab.length > 1 && currentWord 
                ? vocab.filter(w => !(w.es === currentWord.es && w.de === currentWord.de)) 
                : vocab;

            // Gewichtung basierend auf der Kategorie der AKTIVEN Richtung
            const totalWeight = pool.reduce((sum, item) => {
                const cat = getActiveCat(item);
                return sum + (catMeta[cat]?.weight || 8);
            }, 0);

            let random = Math.random() * totalWeight;

            for (const item of pool) {
                const cat = getActiveCat(item);
                random -= (catMeta[cat]?.weight || 8);
                if (random <= 0) {
                    currentWord = item;
                    break;
                }
            }

            stepState = "answering";
            renderQuestion();
        }

        function renderQuestion() {
            const activeCat = getActiveCat(currentWord);
            const otherCat = getOtherCat(currentWord);
            const meta = catMeta[activeCat] || catMeta[1];

            document.getElementById("flashcard").style.borderTopColor = meta.color;
            const badge = document.getElementById("catBadge");
            badge.style.background = meta.color;
            badge.innerText = meta.name;

            document.getElementById("otherCatBadge").innerText = `Gegenrichtung: Kat ${otherCat}`;
            document.getElementById("questionText").innerText = esToDe ? currentWord.es : currentWord.de;
            document.getElementById("btnSpeakQuestion").classList.toggle("hidden", !esToDe);

            const input = document.getElementById("userInput");
            input.value = "";
            document.getElementById("wordRow").classList.remove("hidden");
            document.getElementById("editSection").classList.add("hidden");
            document.getElementById("inputSection").classList.remove("hidden");
            document.getElementById("feedbackSection").classList.add("hidden");
            document.getElementById("manualSection").classList.add("hidden");
            
            setTimeout(() => input.focus(), 50);
        }

        function levenshtein(a, b) {
            const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[a.length][b.length];
        }

        function cleanText(str) {
            return str.toLowerCase()
                .replace(/\([^)]*\)/g, "")
                .replace(/[¿?¡!.,;:]/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        function stripAccents(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function evaluateInput(userRaw, targetRaw) {
            const userClean = cleanText(userRaw);
            if (!userClean) return { status: "wrong" };

            const variants = [cleanText(targetRaw)];
            targetRaw.split(/[,/]/).forEach(part => {
                const cleaned = cleanText(part);
                if (cleaned) variants.push(cleaned);
            });

            let bestStatus = "wrong";

            for (const target of variants) {
                if (userClean === target) {
                    return { status: "exact" };
                }

                const userNoAcc = stripAccents(userClean);
                const targetNoAcc = stripAccents(target);
                if (userNoAcc === targetNoAcc) {
                    bestStatus = "typo";
                    continue;
                }

                const dist = levenshtein(userNoAcc, targetNoAcc);
                const maxAllowed = target.length <= 3 ? 0 : (target.length <= 6 ? 1 : 2);

                if (dist <= maxAllowed) {
                    bestStatus = "typo";
                }
            }

            return { status: bestStatus };
        }

        function checkTypedAnswer() {
            const rawInput = document.getElementById("userInput").value;
            if (!rawInput.trim()) {
                document.getElementById("userInput").focus();
                return;
            }

            const correctAnswer = esToDe ? currentWord.de : currentWord.es;
            const result = evaluateInput(rawInput, correctAnswer);

            stepState = "evaluated";
            document.getElementById("inputSection").classList.add("hidden");
            document.getElementById("feedbackSection").classList.remove("hidden");

            const box = document.getElementById("feedbackBox");
            const title = document.getElementById("fbTitle");
            const detail = document.getElementById("fbDetail");
            const overrideBtn = document.getElementById("btnOverride");

            const audioBtnHtml = !esToDe 
                ? `<button type="button" class="btn-speak-inline" onclick="speakSpanish()">🔊 Anhören</button>` 
                : "";

            box.className = "feedback-box";
            lastCatBeforeChange = getActiveCat(currentWord);

            if (result.status === "exact") {
                box.classList.add("fb-exact");
                title.innerText = "✓ Perfekt!";
                detail.innerHTML = `Richtige Übersetzung: <b>${correctAnswer}</b> ${audioBtnHtml}`;
                overrideBtn.classList.add("hidden");
                applyCategoryChange(true);
            } else if (result.status === "typo") {
                box.classList.add("fb-typo");
                title.innerText = "⚠ Fast richtig! Tippfehler / Akzent beachten";
                detail.innerHTML = `Deine Eingabe: <s>${rawInput}</s><br>Korrekt wäre: <b>${correctAnswer}</b> ${audioBtnHtml}<br><small>Wurde als <b>gewusst</b> gewertet.</small>`;
                overrideBtn.innerText = "Streng sein: Doch als falsch werten";
                overrideBtn.classList.remove("hidden");
                applyCategoryChange(true);
            } else {
                box.classList.add("fb-wrong");
                title.innerText = "✕ Leider falsch";
                detail.innerHTML = `Deine Eingabe: <s>${rawInput}</s><br>Richtige Lösung: <b>${correctAnswer}</b> ${audioBtnHtml}`;
                overrideBtn.innerText = "Ausnahme: Doch als richtig werten";
                overrideBtn.classList.remove("hidden");
                applyCategoryChange(false);
            }

            setTimeout(() => document.querySelector(".btn-next").focus(), 50);
        }

        function applyCategoryChange(isCorrect) {
            lastCountedCorrect = isCorrect;
            const newCat = isCorrect 
                ? Math.min(lastCatBeforeChange + 1, 4) 
                : Math.max(lastCatBeforeChange - 1, 1);

            setActiveCat(currentWord, newCat);

            const meta = catMeta[newCat] || catMeta[1];
            document.getElementById("flashcard").style.borderTopColor = meta.color;
            const badge = document.getElementById("catBadge");
            badge.style.background = meta.color;
            badge.innerText = meta.name;

            modifiedInSession.add(`${currentWord.es}|${currentWord.de}`);
            saveToLocalCache();
            updateStats();
            saveProgressToSheet({ ...currentWord });
        }

        function overrideLastResult() {
            applyCategoryChange(!lastCountedCorrect);
            document.getElementById("btnOverride").classList.add("hidden");
            document.getElementById("fbTitle").innerText += " (Korrigiert)";
        }

        function manualReveal() {
            stepState = "manual";
            document.getElementById("inputSection").classList.add("hidden");
            document.getElementById("manualSection").classList.remove("hidden");
            document.getElementById("manualSolution").innerText = esToDe ? currentWord.de : currentWord.es;
            document.getElementById("btnSpeakManual").classList.toggle("hidden", esToDe);
        }

        function submitManualResult(isCorrect) {
            lastCatBeforeChange = getActiveCat(currentWord);
            applyCategoryChange(isCorrect);
            pickNextWord();
        }

        async function saveProgressToSheet(wordObj) {
            setStatus("Speichert...");
            try {
                await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(wordObj)
                });
                setStatus("Synchronisiert ✓");
            } catch (err) {
                setStatus("Lokal gespeichert (Offline)");
            }
        }

        function updateStats() {
            const total = vocab.length;
            document.getElementById("totalCount").innerText = `${total} Vokabeln`;

            const esdeCounts = [1, 2, 3, 4].map(c => vocab.filter(v => v.catEsDe === c).length);
            const deesCounts = [1, 2, 3, 4].map(c => vocab.filter(v => v.catDeEs === c).length);

            document.getElementById("esde1").innerText = esdeCounts[0];
            document.getElementById("esde2").innerText = esdeCounts[1];
            document.getElementById("esde3").innerText = esdeCounts[2];
            document.getElementById("esde4").innerText = esdeCounts[3];

            document.getElementById("dees1").innerText = deesCounts[0];
            document.getElementById("dees2").innerText = deesCounts[1];
            document.getElementById("dees3").innerText = deesCounts[2];
            document.getElementById("dees4").innerText = deesCounts[3];

            if (total > 0) {
                const avgEsDe = vocab.reduce((s, v) => s + v.catEsDe, 0) / total;
                const avgDeEs = vocab.reduce((s, v) => s + v.catDeEs, 0) / total;

                document.getElementById("avgEsDe").innerText = `Ø ${avgEsDe.toFixed(2).replace('.', ',')}`;
                document.getElementById("avgDeEs").innerText = `Ø ${avgDeEs.toFixed(2).replace('.', ',')}`;

                const summaryEl = document.getElementById("compareSummary");
                const diff = Math.abs(avgEsDe - avgDeEs);
                if (diff < 0.05) {
                    summaryEl.innerText = "Vergleich: Beide Richtungen sind aktuell gleichauf.";
                } else if (avgEsDe > avgDeEs) {
                    summaryEl.innerText = `Vergleich: Spanisch → Deutsch fällt dir aktuell leichter (Ø ${avgEsDe.toFixed(2).replace('.', ',')} vs. ${avgDeEs.toFixed(2).replace('.', ',')}).`;
                } else {
                    summaryEl.innerText = `Vergleich: Deutsch → Spanisch fällt dir aktuell leichter (Ø ${avgDeEs.toFixed(2).replace('.', ',')} vs. ${avgEsDe.toFixed(2).replace('.', ',')}).`;
                }
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        initApp();
    </script>
